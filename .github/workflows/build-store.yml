name: Build and publish app store

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-store
  cancel-in-progress: true

env:
  # Public URL where dist/ is served — must match where GitHub Pages
  # publishes this repo. Asset links inside the build use this prefix.
  STORE_BASE_URL: https://dieppa.co.uk/zimaos-app-store

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache builder state (image sizes and digests)
        uses: actions/cache@v4
        with:
          path: .cache/build_appstore
          key: appstore-cache-${{ hashFiles('Apps/**/docker-compose.yml') }}
          restore-keys: |
            appstore-cache-

      - name: Build v2 store output
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: ${{ env.STORE_BASE_URL }}
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-report.json
          report-title: dieppon's App Store Build
        env:
          # Optional repo secrets — raise Docker Hub rate limits for
          # image size/digest lookups. The build works without them.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build legacy v1 zip for older clients
        run: |
          mkdir -p dist/store
          zip -q -r dist/store/main.zip \
            Apps store-config.json supported-languages.json README.md LICENSE

      - name: Job summary
        if: always()
        run: |
          {
            echo "### dieppon's App Store build"
            echo
            echo "- base URL: ${{ env.STORE_BASE_URL }}"
            if [ -f dist/index.json ]; then
              echo "- apps published: $(jq -r '.app_count' dist/index.json)"
            fi
            if [ -f dist/store/main.zip ]; then
              echo "- legacy zip: included (\`store/main.zip\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sanity-check the build before publishing
        run: |
          set -euo pipefail
          test -f dist/index.json
          test -f dist/store.json
          echo "apps: $(jq -r '.app_count' dist/index.json)"
          echo "base_url: $(jq -r '.base_url' dist/index.json)"

      - name: Publish to GitHub Pages (gh-pages branch)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -qm "Publish store build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Verify gh-pages now serves the store
        run: |
          set -euo pipefail
          git ls-remote --heads origin gh-pages
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/store.json" \
              | jq -e '.store_id == "com.dieppon.appstore"' >/dev/null; then
              echo "gh-pages is serving the built store"
              exit 0
            fi
            echo "waiting for gh-pages to update ($i/6)..."
            sleep 10
          done
          echo "gh-pages does not expose the built store yet" >&2
          exit 1
