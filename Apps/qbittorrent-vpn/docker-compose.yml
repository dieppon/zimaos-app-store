name: qbittorrent-vpn

services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-5.2.4@sha256:7317b5a12a5658782d4734fc1ca9bcd1d052ee661d0b2e9c90d91bab433f30b4
    container_name: qbittorrent-vpn
    # All traffic goes through the Gluetun VPN container — install and
    # configure "Gluetun VPN" from this store first.
    network_mode: "container:gluetun"
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - UMASK=002
      - TZ=$TZ
      # The web UI listens on 8181 instead of its default 8080, so that the
      # port in the browser's Host header matches the port qBittorrent itself
      # listens on. Its host-header validation rejects any mismatch with
      # "Unauthorized", which is what a plain 8181:8080 remap produces.
      # hotio passes this straight to "qbittorrent-nox --webui-port".
      - WEBUI_PORTS=8181/tcp
    volumes:
      - type: bind
        source: /DATA/AppData/qbittorrent-vpn/config
        target: /config
      - type: bind
        source: /media/Main-Storage/Downloads/qbittorrent
        target: /downloads
    restart: unless-stopped
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: "Container Variable: PUID"
        - container: PGID
          description:
            en_US: "Container Variable: PGID"
        - container: UMASK
          description:
            en_US: "File permission mask applied to new downloads"
        - container: TZ
          description:
            en_US: "Container Variable: TZ"
        - container: WEBUI_PORTS
          description:
            en_US: "Web UI port inside the VPN namespace — keep 8181, it must match the port Gluetun publishes"
      volumes:
        - container: /config
          description:
            en_US: "qBittorrent configuration, session data and Web UI settings"
        - container: /downloads
          description:
            en_US: "Where finished and in-progress torrents are saved"

x-casaos:
  id: com.dieppon.qbittorrent-vpn
  main: qbittorrent
  index: /
  scheme: http
  port_map: "8181"
  # Kept as-is from the official ZimaOS store listing (SVG)
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@gh-pages/apps/org.icewhale.qbittorrent/assets/icon.svg
  title:
    en_US: qBittorrent
  tagline:
    en_US: Feature-rich BitTorrent client — traffic routed through your Gluetun VPN tunnel.
  description:
    en_US: >-
      qBittorrent is a popular, feature-rich BitTorrent client with a built-in
      web UI, search engine and RSS support. This package is hotio's build of
      qBittorrent, routed through the Gluetun VPN container so that all of its
      traffic (peers, trackers, DHT) leaves from your VPN address instead of
      your home IP. The Web UI is published by Gluetun on port 8181 and
      downloads are saved to your Downloads/qbittorrent folder.
  tips:
    before_install:
      en_US: >-
        Install and configure "Gluetun VPN" from this store first — this app
        shares Gluetun's network stack and is unreachable without it. Open the
        Web UI on http://<server>:8181 and log in as admin; on first start
        qBittorrent logs a temporary password (some builds default to
        adminadmin). Change the password and the incoming-connection port
        (use 6881 to match the port Gluetun opens) right after installing.
  author: dieppon
  developer: qBittorrent project
  category: Media
  architectures:
    - amd64
    - arm64
  # Store revision: the image is still 5.2.4, but the web UI now listens on
  # 8181, and only a strictly higher version is offered as an update.
  version: "5.2.5"
  update_at: "2026-10-18"
  website: https://www.qbittorrent.org
  repo: https://github.com/hotio/qbittorrent
  docs: https://hotio.dev/containers/qbittorrent/
